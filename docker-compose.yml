services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: call_my_bluff
      POSTGRES_USER: cmb
      POSTGRES_PASSWORD: cmb_local
    volumes:
      - cmb-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmb -d call_my_bluff"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  cmb-postgres:
