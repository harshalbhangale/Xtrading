name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: call_my_bluff
          POSTGRES_USER: cmb
          POSTGRES_PASSWORD: cmb_local
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U cmb -d call_my_bluff"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      IDENTITY_TEST_DATABASE_URL: postgresql://cmb:cmb_local@localhost:5433/call_my_bluff
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm indexer:codegen
      - run: pnpm db:migrate
      - run: pnpm check
