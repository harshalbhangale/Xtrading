type StakePosition {
  id: ID!
  chainId: Int!
  contract: String!
  wallet: String!
  balance: BigInt!
  withdrawableAt: BigInt!
  updatedAtBlock: BigInt!
  updatedAtTimestamp: BigInt!
}

type StakeEvent {
  id: ID!
  positionId: String!
  balance: BigInt!
  withdrawableAt: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
}

# Kuru V2 AccountCore numeric account, keyed by chain and account ID.
type KuruAccount {
  id: ID!
  chainId: Int!
  accountId: BigInt!
  rootAccountId: BigInt!
  rootOwner: String!
  registeredAtBlock: BigInt!
}

# One confirmed taker swap (SpotSwap). Amounts are raw token atoms.
type KuruSwap {
  id: ID!
  chainId: Int!
  market: String!
  accountId: BigInt!
  executor: String!
  isBuy: Boolean!
  amountIn: BigInt!
  amountOut: BigInt!
  minAmountOut: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: String!
}

# AccountCore custody movement: "deposit" (payer) or "withdrawal" (recipient).
type KuruTransfer {
  id: ID!
  chainId: Int!
  kind: String!
  accountId: BigInt!
  token: String!
  counterparty: String!
  amount: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: String!
}

# Actual creator payment, never a quote. Reorg rollback removes orphaned events.
type CreatorFeePayment {
  id: ID!
  chainId: Int!
  contract: String!
  buyer: String!
  creatorWallet: String!
  token: String!
  amount: BigInt!
  transactionHash: String!
  blockHash: String!
  blockNumber: BigInt!
  timestamp: BigInt!
}

type CreatorFlowSwap {
  id: ID!
  chainId: Int!
  buyer: String!
  creatorWallet: String!
  tokenIn: String!
  tokenOut: String!
  amountIn: BigInt!
  netAmountOut: BigInt!
  referrerFeeBps: BigInt!
  transactionHash: String!
  blockHash: String!
  blockNumber: BigInt!
  timestamp: BigInt!
}
