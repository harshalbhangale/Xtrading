# Verified deployments: contracts/deployments/{monad-testnet,mock-stake-monad-testnet}.json.
# Kuru Spot V2: https://kuru-testnet-docs.mintlify.site/deployments/testnet (SDK 0.2.0 ABIs).
name: call-my-bluff-stakes
description: Xtrading creator stakes and spot swaps on testnet; Kuru Flow creator payments on mainnet
rollback_on_reorg: true
field_selection:
  transaction_fields:
    - hash
contracts:
  - name: CreatorStake
    handler: src/handlers.ts
    events:
      - event: StakeUpdated(address indexed wallet, uint256 balance, uint256 withdrawableAt)
  - name: KuruOrderBook
    handler: src/handlers.ts
    events:
      # Taker-level swap summary; enough for user fill history, not for book mirroring.
      - event: SpotSwap(uint40 indexed userId, address indexed executor, bool indexed isBuy, uint128 amountInUsed, uint128 amountOut, uint128 minAmountOut)
  - name: KuruAccountCore
    handler: src/handlers.ts
    events:
      - event: AccountRegistered(uint40 indexed accountId, uint40 indexed rootAccountId, address indexed rootOwner, uint16 subaccountSeq)
      - event: Deposit(uint40 indexed accountId, address indexed token, address indexed payer, uint256 amount)
      - event: Withdrawal(uint40 indexed accountId, address indexed token, address indexed recipient, uint256 amount)
  # Opt-in call bonds settled by the Chainlink CRE workflow (contracts/src/CallSettlement.sol).
  - name: CallSettlement
    handler: src/handlers.ts
    events:
      - event: CallRegistered(bytes32 indexed callId, address indexed creator, bytes32 asset, uint8 direction, uint16 targetBps, uint64 start, uint64 expiry, uint128 bond, uint128 reward, bytes32 termsHash)
      - event: CallSettled(bytes32 indexed callId, address indexed creator, uint8 outcome, uint256 entryPrice, uint256 exitPrice, uint256 payout, uint256 slashed)
      - event: CallRefunded(bytes32 indexed callId, address indexed creator, uint256 bond)
      - event: SettlementRejected(bytes32 indexed callId, uint8 reason)
  - name: KuruFlow
    handler: src/handlers.ts
    events:
      - event: FeeCollected(address feeCollector, uint256 amount, address referrer, uint256 referrerAmount, address user, address token)
      - event: KuruFlowSwap(address indexed user, address indexed referrer, address tokenIn, address tokenOut, bool isFeeInInput, uint256 amountIn, uint256 amountOut, uint256 referrerFeeBps, uint256 totalFeeBps)
chains:
  - id: 10143
    start_block: 70144598
    max_reorg_depth: 200
    block_lag: 10
    rpc:
      # Set ENVIO_MONAD_RPC_URL in .env for a keyed provider; never commit the key.
      url: ${ENVIO_MONAD_RPC_URL:-https://testnet-rpc.monad.xyz}
      for: sync
      initial_block_interval: 99
      interval_ceiling: 99
    contracts:
      - name: CreatorStake
        address:
          - "0x4B1a8c4E158E4E3EEa22A62205F1e0CD82d0D5B6"
          - "0x9e09b97dBaDc1D6f3A3C5bA9aF0E47923C34634e"
      # No app user had a Kuru V2 account before this block; earlier history is out of scope.
      - name: KuruOrderBook
        start_block: 70280000
        address:
          - "0x9d187971B64505Ac81f12c5FD2ac9c5247Ec62F3" # WETH/USDC
          - "0x8661cB7c5f4f8ae3ee116B63Aa5a23c69110e357" # WBTC/USDC
          - "0x26cd68436B6A4AEB3ec52abC20A4d121f8B4BAc9" # MON/USDC
      - name: KuruAccountCore
        start_block: 70280000
        address:
          - "0xdbaaDe7B42c95399bb1E9614D51B5B9e2cf78038"
      # contracts/deployments/call-settlement-monad-testnet.json
      - name: CallSettlement
        start_block: 70449727
        address:
          - "0x260264E74028d498a1A10f90dDC4f4b91F3395DF" # bonded (retired)
          - "0x836aa86C5B013f2fbbE0Fc960E88677D4C106BB9" # bond-free scorecard

  - id: 143
    # Creator-fee projection starts at the integration validation window, not protocol genesis.
    start_block: 112914000
    max_reorg_depth: 200
    block_lag: 10
    rpc:
      url: ${ENVIO_MONAD_MAINNET_RPC_URL:-https://rpc.monad.xyz}
      for: sync
      initial_block_interval: 99
      interval_ceiling: 99
    contracts:
      - name: KuruFlow
        address:
          - "0xb3e6778480b2E488385E8205eA05E20060B813cb"
