<svg id="c" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const LOGO = "../../logos/";
const C = {
  ink: "#1e1e1e", muted: "#868e96",
  yellow: "#ffec99", green: "#b2f2bb", blue: "#a5d8ff", violet: "#d0bfff",
  red: "#ffc9c9", orange: "#ffd8a8", gray: "#e9ecef", teal: "#96f2d7",
};
const svg = document.getElementById("c");
const rc = rough.svg(svg);
let seed = 7;
const opt = (o = {}) => ({ seed: seed++, roughness: 1.1, bowing: 1, stroke: C.ink, strokeWidth: 1.6, ...o });
const add = (n) => (svg.appendChild(n), n);
const NS = "http://www.w3.org/2000/svg";

function text(x, y, str, { size = 20, anchor = "middle", color = C.ink, weight = 400 } = {}) {
  const t = document.createElementNS(NS, "text");
  t.setAttribute("x", x); t.setAttribute("y", y);
  t.setAttribute("font-size", size); t.setAttribute("text-anchor", anchor);
  t.setAttribute("dominant-baseline", "middle");
  t.setAttribute("font-weight", weight);
  t.style.fill = color;
  t.textContent = str;
  return add(t);
}
function image(x, y, s, file) {
  const i = document.createElementNS(NS, "image");
  i.setAttribute("href", LOGO + file);
  i.setAttribute("x", x); i.setAttribute("y", y);
  i.setAttribute("width", s); i.setAttribute("height", s);
  const clip = `clip${seed++}`;
  const cp = document.createElementNS(NS, "clipPath"); cp.id = clip;
  const r = document.createElementNS(NS, "rect");
  r.setAttribute("x", x); r.setAttribute("y", y); r.setAttribute("width", s); r.setAttribute("height", s);
  r.setAttribute("rx", s * 0.22);
  cp.appendChild(r); add(cp);
  i.setAttribute("clip-path", `url(#${clip})`);
  return add(i);
}
function rrect(x, y, w, h, r) {
  return `M${x + r},${y} L${x + w - r},${y} Q${x + w},${y} ${x + w},${y + r} L${x + w},${y + h - r} Q${x + w},${y + h} ${x + w - r},${y + h} L${x + r},${y + h} Q${x},${y + h} ${x},${y + h - r} L${x},${y + r} Q${x},${y} ${x + r},${y} Z`;
}
// A filled, hand-drawn card with optional logo, title and subtitle.
function box(x, y, w, h, { fill = C.yellow, title, sub, logo, size = 21, hachure = false } = {}) {
  add(rc.path(rrect(x, y, w, h, 14), opt({ fill, fillStyle: hachure ? "hachure" : "solid", hachureGap: 7, fillWeight: 1.2 })));
  const lines = sub ? (Array.isArray(sub) ? sub : [sub]) : [];
  const cy = y + h / 2 - (lines.length * 11);
  if (logo) {
    const s = 30;
    const tw = title.length * size * 0.5;
    const total = s + 10 + tw;
    const lx = x + w / 2 - total / 2;
    image(lx, cy - s / 2, s, logo);
    text(lx + s + 10, cy, title, { size, anchor: "start" });
  } else text(x + w / 2, cy, title, { size });
  lines.forEach((l, i) => text(x + w / 2, cy + 26 + i * 21, l, { size: 15, color: "#495057" }));
}
// A dashed group frame with a title tab.
function frame(x, y, w, h, title, { logo, fill = "#f8f9fa" } = {}) {
  add(rc.path(rrect(x, y, w, h, 18), opt({ fill, fillStyle: "solid", strokeLineDash: [9, 7], strokeWidth: 1.4, roughness: 0.8 })));
  if (logo) { image(x + 16, y + 12, 26, logo); text(x + 52, y + 26, title, { size: 22, anchor: "start" }); }
  else text(x + 18, y + 26, title, { size: 22, anchor: "start" });
}
// Arrow through points, with an optional label near the middle.
function arrow(pts, label, { lx, ly, dashed = false, color = C.ink } = {}) {
  const o = opt({ strokeWidth: 1.8, stroke: color, roughness: 0.9, ...(dashed ? { strokeLineDash: [7, 6] } : {}) });
  add(pts.length > 2 ? rc.linearPath(pts, o) : rc.line(...pts[0], ...pts[1], o));
  const [ax, ay] = pts[pts.length - 2], [bx, by] = pts[pts.length - 1];
  const a = Math.atan2(by - ay, bx - ax), L = 14;
  for (const d of [0.45, -0.45])
    add(rc.line(bx, by, bx - L * Math.cos(a + d), by - L * Math.sin(a + d), opt({ strokeWidth: 1.8, stroke: color, roughness: 0.6 })));
  if (label) {
    const mx = lx ?? (pts[0][0] + bx) / 2, my = ly ?? (pts[0][1] + by) / 2 - 14;
    const w = label.length * 8.2 + 14;
    const bg = document.createElementNS(NS, "rect");
    bg.setAttribute("x", mx - w / 2); bg.setAttribute("y", my - 12); bg.setAttribute("width", w); bg.setAttribute("height", 24);
    bg.setAttribute("fill", "#ffffff"); bg.setAttribute("rx", 6);
    add(bg);
    text(mx, my, label, { size: 15, color: "#495057" });
  }
}
function badge(x, y, n) {
  add(rc.circle(x, y, 34, opt({ fill: C.ink, fillStyle: "solid" })));
  text(x, y + 1, String(n), { size: 18, color: "#ffffff" });
}

// ---- Helpers for the technical overview (docs/architecture.md) ----

// Named nodes, so arrows can attach to a side of a box or diamond.
let N = {};
function node(id, x, y, w, h, o) { box(x, y, w, h, o); N[id] = { x, y, w, h }; }
function decision(id, x, y, w, h, lines, { fill = C.orange } = {}) {
  add(rc.polygon([[x + w / 2, y], [x + w, y + h / 2], [x + w / 2, y + h], [x, y + h / 2]], opt({ fill, fillStyle: "solid" })));
  lines.forEach((l, i) => text(x + w / 2, y + h / 2 + (i - (lines.length - 1) / 2) * 21, l, { size: 17 }));
  N[id] = { x, y, w, h };
}
function side(id, s, t = 0.5) {
  const b = N[id];
  return s === "l" ? [b.x - 2, b.y + b.h * t] : s === "r" ? [b.x + b.w + 2, b.y + b.h * t]
    : s === "t" ? [b.x + b.w * t, b.y - 2] : [b.x + b.w * t, b.y + b.h + 2];
}
// Arrow from one node side to another; straight, or one elbow, or two.
function link(a, as, b, bs, label, o = {}) {
  const p = side(a, as, o.at), q = side(b, bs, o.bt);
  let pts;
  if (o.via) pts = [p, ...o.via, q];
  else if (Math.abs(p[0] - q[0]) < 1 || Math.abs(p[1] - q[1]) < 1) pts = [p, q];
  else if ("lr".includes(as) && "lr".includes(bs)) { const mx = o.mx ?? (p[0] + q[0]) / 2; pts = [p, [mx, p[1]], [mx, q[1]], q]; }
  else if ("tb".includes(as) && "tb".includes(bs)) { const my = o.my ?? (p[1] + q[1]) / 2; pts = [p, [p[0], my], [q[0], my], q]; }
  else if ("lr".includes(as)) pts = [p, [q[0], p[1]], q];
  else pts = [p, [p[0], q[1]], q];
  arrow(pts, label, o);
}
function note(x, y, str, { size = 16, anchor = "start" } = {}) { text(x, y, str, { size, anchor, color: C.muted }); }
function size(W, H, title) {
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  text(40, 40, title, { size: 32, anchor: "start" });
}

// A hand-drawn sequence diagram: participant cards, dashed lifelines, numbered messages.
function sequence(title, parts, rows, { W = 1640, cardW = 250 } = {}) {
  const top = 80, ph = 74, margin = 30, colW = (W - 2 * margin) / parts.length;
  const X = {};
  parts.forEach((p, i) => (X[p.id] = margin + colW * i + colW / 2));
  const items = [];
  let y = top + ph + 34;
  const layout = (list) => {
    for (const r of list) {
      if (r.loop) {
        const y0 = y; y += 40; layout(r.loop);
        items.push({ kind: "frame", y0, y1: y + 2, label: r.label }); y += 24;
      } else if (r.note) {
        items.push({ kind: "note", r, y }); y += 66;
      } else {
        const lines = Array.isArray(r.label) ? r.label : [r.label];
        const h = 22 + lines.length * 20 + (r.from === r.to ? 14 : 0);
        items.push({ kind: "msg", r, lines, y: y + h - 10 }); y += h + 6;
      }
    }
  };
  layout(rows);
  const H = y + 30;
  size(W, H, title);
  for (const it of items.filter((i) => i.kind === "frame")) {
    add(rc.path(rrect(margin + 6, it.y0, W - 2 * margin - 12, it.y1 - it.y0, 12), opt({ fill: "#f8f9fa", fillStyle: "solid", strokeLineDash: [8, 6], strokeWidth: 1.3, roughness: 0.7 })));
    text(margin + 22, it.y0 + 18, it.label, { size: 16, anchor: "start", color: "#495057" });
  }
  for (const p of parts)
    add(rc.line(X[p.id], top + ph, X[p.id], H - 20, opt({ stroke: C.muted, strokeWidth: 1.2, strokeLineDash: [6, 7], roughness: 0.4 })));
  for (const p of parts) {
    const w = Math.min(colW - 24, cardW);
    box(X[p.id] - w / 2, top, w, ph, { fill: p.fill ?? C.yellow, title: p.name, logo: p.logo, sub: p.sub, size: 19 });
  }
  let n = 1;
  for (const it of items) {
    if (it.kind === "note") {
      const xs = it.r.over.map((id) => X[id]);
      const x0 = Math.min(...xs) - 90, x1 = Math.max(...xs) + 90;
      add(rc.path(rrect(x0, it.y, x1 - x0, 46, 8), opt({ fill: "#fff3bf", fillStyle: "solid", roughness: 0.8 })));
      text((x0 + x1) / 2, it.y + 23, it.r.note, { size: 16 });
    }
    if (it.kind !== "msg") continue;
    const { r, lines } = it, x1 = X[r.from], x2 = X[r.to], ay = it.y;
    const o = { strokeWidth: 1.7, ...(r.dashed ? { strokeLineDash: [7, 6] } : {}) };
    if (x1 === x2) {
      arrow([[x1 + 14, ay - 22], [x1 + 60, ay - 22], [x1 + 60, ay + 4], [x1 + 4, ay + 4]], "", o);
      lines.forEach((l, i) => {
        const ly = ay - 9 - (lines.length - 1 - i) * 20;
        const w = l.length * 7.6 + 12;
        const bg = document.createElementNS(NS, "rect");
        bg.setAttribute("x", x1 + 68); bg.setAttribute("y", ly - 11); bg.setAttribute("width", w); bg.setAttribute("height", 22); bg.setAttribute("fill", "#ffffff");
        add(bg);
        text(x1 + 74, ly, l, { size: 15, anchor: "start", color: "#343a40" });
      });
    } else {
      const dir = Math.sign(x2 - x1);
      arrow([[x1 + dir * 14, ay], [x2 - dir * 3, ay]], "", { dashed: r.dashed });
      const mx = (x1 + x2) / 2;
      lines.forEach((l, i) => {
        const ly = ay - 15 - (lines.length - 1 - i) * 20;
        const w = l.length * 7.6 + 12;
        const bg = document.createElementNS(NS, "rect");
        bg.setAttribute("x", mx - w / 2); bg.setAttribute("y", ly - 11); bg.setAttribute("width", w); bg.setAttribute("height", 22); bg.setAttribute("fill", "#ffffff");
        add(bg);
        text(mx, ly, l, { size: 15, color: "#343a40" });
      });
    }
    add(rc.circle(x1, x1 === x2 ? ay - 22 : ay, 24, opt({ fill: C.ink, fillStyle: "solid", roughness: 0.6 })));
    text(x1, (x1 === x2 ? ay - 22 : ay) + 1, String(n++), { size: 13, color: "#ffffff" });
  }
}
